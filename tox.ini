[tox]
min_version = 4.0
env_list = py312, lint, type
requires = tox>=4.15

[testenv]
description = run unit tests
package = editable
setenv =
    PYTHONDONTWRITEBYTECODE = 1
extras = dev
commands =
    pytest {posargs}

test_command = pytest {posargs}

[testenv:lint]
description = ruff formatting and lint checks
skip_install = true
deps = ruff>=0.5
commands =
    ruff check src tests
    ruff format --check src tests

[testenv:type]
description = mypy static type checking
extras = dev
commands =
    mypy src tests
